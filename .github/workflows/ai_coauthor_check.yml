name: AI co-author check

# Fails a pull request if any of its commits lists an AI tool as co-author
# (a "Co-authored-by:" trailer) or as author, and explains how to replace it
# with an "Assisted-by:" trailer. See docs/source/ai_policy.rst.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-ai-coauthors:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check commits for AI tools listed as co-author or author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/ai_coauthor.py check "$BASE_SHA" "$HEAD_SHA"
