name: xpsi
channels:
        - defaults
        - conda-forge
dependencies:
        - python >= 3.10.0
        - numpy
        - cython~= 3.0.11
        - matplotlib
        - scipy
        - pandas # reading tabulated temperature maps
        - wrapt
        - setuptools>=61
        - gsl # GNU Science library
        - pytest  # running functionality self-tests
        - getdist  # posterior KDE corner plotting
        - tqdm   # progress bar package
        - h5py  # storage of X-ray signals computed from posterior samples
        - nestcheck  # posterior error analysis, plotting, run combination, etc.
        - pip:
          - fgivenx>=2.5.1   # >=2.5.1 needed for numpy 2.x / newer matplotlib
        - astropy # reading FITS files
        - emcee  # MCMC sammpler
        - cmap # For PostProcessing colormaps
        - lxml # For PostProcessing corner plots (PDF format)
        - esda  # For PostProcessing residual plots
        - libpysal   # For PostProcessing residual plots
